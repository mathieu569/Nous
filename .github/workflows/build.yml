name: Build Nous

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # On ne versionne que lib/ et pubspec.yaml: les dossiers de plateforme sont générés ici.
      - name: Générer les fichiers Android
        run: flutter create --platforms=android --project-name nous --org fr.nous.couple .

      # Flutter n'autorise ni Internet ni les notifications en version release par défaut.
      - name: Autoriser Internet et notifications
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      # Firebase demande une version d'Android minimale plus récente que celle par défaut.
      - name: Version minimale d'Android
        run: |
          sed -i -E 's/minSdk(Version)?( *=)? *flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle*
          grep -n "minSdk" android/app/build.gradle*

      - run: rm -rf test

      - run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nous-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    # Aperçu web testable sur iPhone. Nécessite GitHub Pages (dépôt public sur un compte gratuit).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les fichiers web
        run: flutter create --platforms=web --project-name nous --org fr.nous.couple .

      - name: Fichiers des notifications web
        run: |
          cp web_extra/firebase-messaging-sw.js web/firebase-messaging-sw.js
          cp web_extra/sw-redirect.js web/sw-redirect.js
          sed -i 's#</head>#  <script src="sw-redirect.js"></script>\n</head>#' web/index.html
          grep -n "sw-redirect" web/index.html

      - run: rm -rf test

      - run: flutter pub get

      - name: Compiler le site
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
